name: yipethome
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.3
  dio: ^5.11.0
  image_picker: ^1.2.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/splash/
    - assets/images/login/
    - assets/images/common/
    - assets/images/home/
    - assets/images/shop/
    - assets/images/payment/
    - assets/images/pet/
    - assets/images/ai/
    - assets/images/my/
    - assets/images/shop/search-result/
    - assets/images/shop/cart/
    - assets/images/shop/category/
    - assets/images/shop/product/
    - assets/images/pet/appointment/
    - assets/images/my/help-support/
    - assets/images/my/about/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash/logo.png

  android: true
  ios: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/splash/logo.png
